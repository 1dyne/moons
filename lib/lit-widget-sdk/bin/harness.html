<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>lit-widget dev</title>
<style>
:root{--bg:#e6e6e1;--surface:#f5f5f1;--ink:#151515;--muted:#5d5d57;--line:#c9c9c2;--accent:#f2c230}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--ink);background:var(--surface)}
header b{font-family:ui-monospace,monospace}main{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:16px;padding:16px}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--ink);padding:12px;min-width:0}.card h2{font:500 12px ui-monospace,monospace;color:var(--muted);margin:0 0 8px}
iframe{width:100%;border:0;display:block;min-height:40px}#err{color:#b8412f;white-space:pre-wrap}#log{font:12px ui-monospace,monospace;max-height:260px;overflow:auto;margin:0;white-space:pre-wrap}
label{display:flex;gap:6px;align-items:center;font-size:13px}button{font:inherit;border:1px solid var(--ink);background:var(--surface);padding:4px 10px;cursor:pointer}
</style></head><body>
<header><b>lit-widget dev</b><span id="name"></span><span id="size" style="color:var(--muted);font-size:12px"></span></header>
<main>
  <section class="card"><h2>위젯 (lit 안과 같은 격리 칸)</h2><p id="err" hidden></p><iframe id="frame" sandbox="allow-scripts allow-forms" title="widget"></iframe></section>
  <aside class="card"><h2>예시 데이터</h2>
    <label><input type="checkbox" id="dark"> 어두운 스킨</label>
    <p style="font-size:12px;color:var(--muted)">권한: <span id="perms"></span></p>
    <button id="reset">표 비우기</button>
    <h2 style="margin-top:12px">API 호출</h2><pre id="log"></pre></aside>
</main>
<script type="module">
import {buildSrcdoc} from '/sdk/srcdoc.ts';
import {attachHost} from '/sdk/host.ts';
const $ = id => document.getElementById(id);
const today = new Date().toISOString().slice(0, 10);
const KEY = 'lit-widget-dev-rows';
let rows = JSON.parse(localStorage.getItem(KEY) || '[]');
const saveRows = () => localStorage.setItem(KEY, JSON.stringify(rows));
const tasks = [{id: 't1', title: '언어이해 기출 1세트', result: 'done', goalIds: ['g2'], estimateMin: 60, props: {과목: '언어'}}, {id: 't2', title: '추리논증 오답 정리', result: 'unknown', goalIds: ['g2'], estimateMin: 45, props: {과목: '추리'}}, {id: 't3', title: '운동 40분', result: 'unknown', goalIds: [], estimateMin: 40, props: {}}];
const goals = [{id: 'g1', title: '2027 LEET 상위 10%', horizon: 'year', period: '2027', percent: 34, parentId: null, deadline: '2027-07'}, {id: 'g2', title: '기출 1회독', horizon: 'milestone', period: today.slice(0, 7), percent: 58, parentId: 'g1', deadline: null}];
const theme = () => $('dark').checked ? {bg: '#151515', surface: '#1f1f1d', ink: '#ecece7', muted: '#a3a39b', accent: '#f2c230', font: 'system-ui, sans-serif', radius: 0, dark: true} : {bg: '#e6e6e1', surface: '#f5f5f1', ink: '#151515', muted: '#5d5d57', accent: '#f2c230', font: 'system-ui, sans-serif', radius: 0, dark: false};
const log = (s) => { $('log').textContent = `${new Date().toTimeString().slice(0, 8)} ${s}\n` + $('log').textContent.slice(0, 4000); };
let host, manifest;
const id = () => Math.random().toString(36).slice(2, 10);
async function load() {
  const m = await (await fetch('/__widget')).json();
  if (m.error) { $('err').textContent = m.error; $('err').hidden = false; return; }
  $('err').hidden = true; manifest = m;
  $('name').textContent = `${m.name} ${m.version ?? '1.0.0'}`; $('perms').textContent = (m.permissions ?? []).join(', ') || '없음';
  $('size').textContent = `${Math.round(JSON.stringify(m).length / 1024)}KB`;
  if (!m.code && !m.html) { $('err').textContent = '블록 위젯이에요. 블록은 lit 안에서 그려져요(코드 위젯만 여기서 미리 봐요).'; $('err').hidden = false; return; }
  host?.dispose();
  const frame = $('frame');
  host = attachHost(frame, {permissions: m.permissions ?? [], onResize: h => { frame.style.height = h + 'px'; }, handlers: {
    context: () => ({day: today, today, widgetId: m.id, instanceId: 'dev', theme: theme(), permissions: m.permissions ?? [], protocol: 1}),
    'table.rows': () => (log('table.rows'), rows),
    'table.add': p => { const r = {id: id(), day: today, name: p.name || '', cells: p.cells || {}, createdAt: new Date().toISOString()}; rows.push(r); saveRows(); log(`table.add ${JSON.stringify(p.cells)}`); change(); return r; },
    'table.update': p => { const r = rows.find(x => x.id === p.id); if (!r) throw new Error('이 위젯의 줄이 아니에요.'); Object.assign(r.cells, p.cells || {}); if (typeof p.name === 'string') r.name = p.name; saveRows(); log(`table.update ${p.id}`); change(); return r; },
    'table.remove': p => { rows = rows.filter(x => x.id !== p.id); saveRows(); log(`table.remove ${p.id}`); change(); return {removed: p.id}; },
    'tasks.today': () => (log('tasks.today'), tasks),
    'goals.list': () => (log('goals.list'), goals),
    'condition.today': () => (log('condition.today'), {day: today, score: 7, sleepMinutes: 390}),
  }});
  frame.srcdoc = buildSrcdoc(m, theme());
}
const change = () => setTimeout(() => host?.push('change'), 50);
$('dark').onchange = () => { document.body.style.background = theme().bg; host?.push('theme', theme()); };
$('reset').onclick = () => { rows = []; saveRows(); change(); log('표를 비웠어요'); };
let last = '';
setInterval(async () => { const s = await (await fetch('/__stamp')).text(); if (last && s !== last) { log('파일이 바뀌어 다시 그려요'); await load(); } last = s; }, 800);
await load();
</script></body></html>
